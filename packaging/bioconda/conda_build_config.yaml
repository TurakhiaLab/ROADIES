# Local-validation-only variant config. bioconda-recipes builds normally get
# their compiler/CUDA pins from bioconda-utils' own global config, not a
# per-recipe file like this - this exists so `conda-build packaging/bioconda
# -c bioconda -c conda-forge` can be run standalone (as done to validate this
# recipe end-to-end on 2026-08-07 - see README.md's "conda-build now succeeds
# end to end" section). Before submitting to bioconda-recipes, check what
# compiler/CUDA versions their global config actually resolves to for CUDA
# recipes and whether the GCC-12-vs-nvcc-12.2 incompatibility documented in
# README.md still applies.
cuda_compiler:
  - cuda-nvcc
cuda_compiler_version:
  - 12.2
docker_image:
  - quay.io/condaforge/linux-anvil-cuda:12.2
c_compiler:
  - gcc
cxx_compiler:
  - gxx
# VERIFIED (2026-08-07): gcc 12 (resolves to 12.4.0 on conda-forge) fails to
# compile TWILIGHT's .cu files under nvcc 12.2 - GCC 12.4's newer
# AVX512BF16/AMX intrinsics headers trip up nvcc's frontend
# ("__builtin_ia32_... is undefined"), independent of -march flags. nvcc
# 12.2's official support matrix tops out around GCC 12.1. gcc 11 avoids
# this entirely.
c_compiler_version:
  - 11
cxx_compiler_version:
  - 11
