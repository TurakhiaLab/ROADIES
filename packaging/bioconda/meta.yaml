{% set name = "roadies" %}
{% set version = "0.2.0" %}  {# TODO: set to the actual tag once main+roadies_2 are merged and released #}
{% set libpll_version = "0.3.2" %}  {# matches Ubuntu's libpll-dev 0.3.2-2 (Source: libpll, Homepage: http://www.libpll.org/) #}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/TurakhiaLab/ROADIES/archive/v{{ version }}.tar.gz
    sha256: REPLACE_ME  # TODO: sha256sum of the v{{ version }} release tarball once it exists
  # libpll has no bioconda/conda-forge package - vendored here to satisfy
  # MLIPPER's link-time dependency. Tag 0.3.2 matches Ubuntu's libpll-dev
  # 0.3.2-2 (upstream: xflouris/libpll, autotools build). MLIPPER's src/
  # only uses libpll's precision-independent Newick-parsing API, so it's
  # safe against either libpll or libpll-2 as long as build/link always use
  # a matching header+lib pair (already guaranteed by the Makefile's
  # PLL_INC_DIR/PLL_LIB_DIR pairing) - see README.md for the full writeup
  # and the GPU-tested verification behind this.
  - git_url: https://github.com/xflouris/libpll.git
    git_rev: {{ libpll_version }}
    folder: libpll-src

build:
  number: 0
  run_exports:
    - {{ pin_subpackage("roadies", max_pin=None) }}
  # CUDA build is Linux-only, same as upstream TWILIGHT/KegAlign recipes.
  skip: True  # [win or osx]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - {{ compiler('cuda') }}          # for MLIPPER; see TWILIGHT/KegAlign recipes for this pattern
    - cuda-version >=12.2,<13         # keep in sync with TWILIGHT's own CUDA build path
    - cmake                           # also needed to vendor-build TWILIGHT (install/buildTWILIGHT.sh)
    - make
    - autoconf                        # libpll's build system is autotools
    - automake
    - libtool
    - pkg-config
    - git                             # build.sh git-clones TWILIGHT (buildTWILIGHT.sh's own wget dep is in host:)
  host:
    # Matches roadies_env.sh's actual dev setup (python=3.11), not the ==3.9
    # the live v0.1.10 bioconda recipe pins.
    - python ==3.11
    - pip
    - boost-cpp
    - zlib
    - wget
    - unzip
    - openjdk >=1.7
    - perl >=5.22
    - perl-bioperl >=1.7.2
    - perl-module-build
    - liblapack                       # MLIPPER links -llapack -lblas directly
    - libblas
    # Must stay pinned to the same cuda-version as the build: compiler
    # (conda_build_config.yaml's cuda_compiler_version) - left unpinned, the
    # solver can pick a newer cudart than the toolkit and nvlink refuses to
    # link ("libcudadevrt.a ... newer than toolkit"). Standard practice in
    # conda-forge CUDA recipes (TWILIGHT/KegAlign included).
    - cuda-cudart-dev >=12.2,<12.3    # [linux]
  run:
    - python ==3.11
    - biopython
    - numpy
    - boost-cpp
    - matplotlib-base
    - seaborn-base
    - ete3
    - pyyaml
    - raxml-ng
    - snakemake-minimal
    - pasta >=1.9.0
    - treeswift >=1.1.28
    - fasttree >=2.1.11
    - alive-progress
    - perl >=5.22
    - perl-bioperl >=1.7.2
    - mash >=2
    - quicktree
    - mashtree ==1.4.6
    - lastz >=1.04.52
    - aster >=1.19
    # --- ROADIES_XP additions ---
    # `twilight`/`kegalign` deliberately NOT listed here: their published
    # builds pin disjoint tbb version ranges (kegalign <2021, twilight
    # >=2021.13), an unsolvable conflict in one environment. Turns out
    # neither needs to be a run: dep anyway - TWILIGHT is vendor-built from
    # source below (invoked via a hardcoded path, vendors its own oneTBB);
    # kegalign runs in its own isolated Snakemake --use-conda environment
    # (workflow/envs/kegalign.yaml), fetched automatically the first time
    # that rule runs. See README.md for the full investigation.
    - epa-ng                          # placement-mode dependency
    - gappa                           # placement-mode dependency
    - cuda-cudart                     # [linux] - MLIPPER links -lcudart -lcuda; needed at run time, not just build time
    - {{ pin_compatible("cuda-version", min_pin="x.x", max_pin="x") }}  # [linux]

test:
  commands:
    - python $PREFIX/ROADIES/run_roadies.py --help
    - mashtree --help
    - test -x $PREFIX/ROADIES/MLIPPER/MLIPPER          # confirms the vendored MLIPPER binary made it into the package

about:
  home: "https://github.com/TurakhiaLab/ROADIES"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: "https://turakhia.ucsd.edu/ROADIES"
  dev_url: "https://github.com/TurakhiaLab/ROADIES"
  summary: "Reference-free Orthology-free Alignment-free DIscordance aware Estimation of Species tree (ROADIES), including ROADIES_XP placement mode and GPU acceleration."
  description: |
    ROADIES is an end-to-end pipeline designed for phylogenetic tree inference of the species directly from their raw genomic assemblies. ROADIES offers a fully automated, easy-to-use, scalable solution, eliminating any error-prone manual steps and providing unique flexibility in adjusting the tradeoff between accuracy and runtime. ROADIES_XP extends this with GPU-accelerated alignment/tree-building and a placement mode for growing or updating an existing species tree with new genomes.

extra:
  recipe-maintainers:
    - ang037
  identifiers:
    - doi:10.1101/2024.05.27.596098
